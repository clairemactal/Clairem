<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Signup Form</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .form-container {
      width: 100%;
      max-width: 450px;
      border: 1px solid #1a365d;
    }

    .form-header {
      background-color: #1e40af;
      color: #ffffff;
      padding: 12px 15px;
    }

    .form-header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: normal;
    }

    .form-body {
      background-color: #1d4ed8;
      color: #ffffff;
      padding: 15px;
    }

    .form-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .form-row label {
      width: 32%;
      font-weight: bold;
      font-size: 13px;
      padding-right: 5px;
    }

    .form-row input[type="text"],
    .form-row input[type="email"],
    .form-row input[type="tel"],
    .form-row input[type="password"],
    .form-row select {
      width: 68%;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 2px;
      color: #000;
      font-size: 13px;
    }

    .inline-selects {
      display: flex;
      gap: 4px;
      width: 68%;
    }

    .inline-selects select {
      width: 33.33%;
      padding: 5px 2px;
      font-size: 12px;
    }

    .inline-radios {
      display: flex;
      gap: 15px;
      width: 68%;
    }

    .inline-radios label {
      width: auto;
      font-weight: normal;
    }

    .checkbox-row {
      justify-content: center;
      margin-top: 15px;
    }

    .checkbox-row label {
      width: auto;
      font-weight: normal;
      margin-left: 8px;
    }

    .form-footer {
      background-color: #93c5fd;
      padding: 12px 15px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .form-footer button {
      padding: 8px 18px;
      border: none;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .btn-submit {
      background-color: #2563eb;
    }

    .btn-cancel {
      background-color: #3b82f6;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="form-header">
      <h2>Sign Up</h2>
    </div>

    <form class="form-body">
      <div class="form-row">
        <label for="fname">First Name</label>
        <input type="text" id="fname" placeholder="Enter First Name">
      </div>

      <div class="form-row">
        <label for="lname">Last Name</label>
        <input type="text" id="lname" placeholder="Enter Last Name">
      </div>

      <!-- Date of Birth -->
      <div class="form-row">
        <label>Date of Birth</label>
        <div class="inline-selects">
          <select id="dob-day">
            <option value="">Date</option>
          </select>

          <select id="dob-month">
            <option value="">Month</option>
            <option value="1">Jan</option>
            <option value="2">Feb</option>
            <option value="3">Mar</option>
            <option value="4">Apr</option>
            <option value="5">May</option>
            <option value="6">Jun</option>
            <option value="7">Jul</option>
            <option value="8">Aug</option>
            <option value="9">Sep</option>
            <option value="10">Oct</option>
            <option value="11">Nov</option>
            <option value="12">Dec</option>
          </select>

          <select id="dob-year">
            <option value="">Year</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <label>Gender</label>
        <div class="inline-radios">
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
        </div>
      </div>

      <div class="form-row">
        <label for="country">Country</label>
        <select id="country">
          <option>Country</option>
          <option>United States</option>
          <option>Canada</option>
          <option>United Kingdom</option>
          <option>Philippines</option>
          <option>Australia</option>
        </select>
      </div>

      <div class="form-row">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Enter E-mail">
      </div>

      <div class="form-row">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="Enter Phone">
      </div>

      <div class="form-row">
        <label for="pass">Password</label>
        <input type="password" id="pass">
      </div>

      <div class="form-row">
        <label for="confirm-pass">Confirm Password</label>
        <input type="password" id="confirm-pass">
      </div>

      <div class="form-row checkbox-row">
        <input type="checkbox" id="terms">
        <label for="terms">I Agree to the Terms of use</label>
      </div>
    </form>

    <div class="form-footer">
      <button type="submit" class="btn-submit">Submit</button>
      <button type="button" class="btn-cancel">Cancel</button>
    </div>
  </div>

  <script>
    // Populate Days (1-31)
    const daySelect = document.getElementById("dob-day");
    for (let day = 1; day <= 31; day++) {
      const option = document.createElement("option");
      option.value = day;
      option.textContent = day;
      daySelect.appendChild(option);
    }

    // Populate Every Year (2026 down to 1900)
    const yearSelect = document.getElementById("dob-year");
    const currentYear = new Date().getFullYear();

    for (let year = currentYear; year >= 1900; year--) {
      const option = document.createElement("option");
      option.value = year;
      option.textContent = year;
      yearSelect.appendChild(option);
    }
  </script>

</body>
</html>
