<!DOCTYPE html>
<html>
<head>
    <title>My Favorite Apps</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#ffd6e7,#ffc0cb,#ffe4f2);
        }

        .card{
            width:390px;
            padding:35px;
            text-align:center;
            border-radius:30px;
            background:rgba(255,255,255,.85);
            border:6px solid #ff69b4;
            box-shadow:0 10px 30px rgba(255,105,180,.4);
        }

        h1{
            color:#ff1493;
            font-size:40px;
            margin-bottom:10px;
        }

        p{
            color:#d63384;
            margin-bottom:25px;
            font-size:18px;
        }

        a{
            display:block;
            text-decoration:none;
            color:white;
            font-size:22px;
            font-weight:bold;
            padding:18px;
            margin:18px 0;
            border-radius:50px;
            border:3px solid white;
            transition:0.3s;
        }

        a:hover{
            transform:scale(1.05);
            box-shadow:0 0 20px #ff69b4;
        }

        .instagram{
            background:linear-gradient(to right,#ff9ecb,#ff4fa3);
        }

        .snapchat{
            background:linear-gradient(to right,#ffc1e3,#ff8ac4);
        }

        .tiktok{
            background:linear-gradient(to right,#ff75b5,#ff1493);
        }

        .wattpad{
            background:linear-gradient(to right,#ffb6d9,#ff69b4);
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>♡ My Favorite Apps ♡</h1>
        <p>Click an app to visit its website!</p>

        <a href="https://www.instagram.com" class="instagram">Instagram</a>

        <a href="https://www.snapchat.com" class="snapchat">Snapchat</a>

        <a href="https://www.tiktok.com" class="tiktok">TikTok</a>

        <a href="https://www.wattpad.com" class="wattpad">Wattpad</a>

    </div>

</body>
</html>
